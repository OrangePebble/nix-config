## Options
# Most were taken from https://www.youtube.com/watch?v=JN4Zbs0ypwM
#  and https://github.com/gpakosz/.tmux/blob/master/.tmux.conf

# Prefix key
set -g prefix C-a
unbind C-b

# Required for Neovim's underlines to fully work, and probably other things.
set -g default-terminal tmux-256color
# Declare server side xterm-256color features option. Required for undercurls to work in Windows/WSL/WezTerm/tmux.
set -as terminal-features ",xterm-256color:RGB:usstyle"

# The following are a couple of options that might be useful to prevent OSC color codes
#  from getting printed raw in the terminal. Not sure how well they work.
set -s escape-time 100
unbind -T root MouseDown1Status
bind -T root MouseDown1Status select-window -t = \; refresh-client -S

# Allows TMUX to better distinguish key modifier combinations.
# For example, this allows <C-S-*> keymaps to work in Neovim.
set -g extended-keys on
set -g extended-keys-format csi-u

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "󰑓 Config reloaded"

# Kill current process and restart pane in its current directory
bind R respawn-pane -k -c "#{pane_current_path}"

# Open a new window in the current directory path
bind c new-window -c "#{pane_current_path}"

# Better split-window keybinds
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Enable mouse (including scrolling)
set -g mouse on

# VIM motions in copy-mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind C-c copy-mode

# Enable mouse dragging
unbind -T copy-mode-vi MouseDragEnd1Pane

# start windows numbering at 1
set -g base-index 1
# make pane numbering consistent with windows
set -g pane-base-index 1

cwd_name="#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}"

# rename window to reflect current program
set -g automatic-rename on
window_name_zsh="#{?#{==:#{pane_current_command},zsh},${cwd_name},#{pane_current_command}}"
window_name_nvim="#{?#{==:#{pane_current_command},nvim},${cwd_name} 󰏫,${window_name_zsh}}"
window_name_lazygit="#{?#{==:#{pane_current_command},lazygit},${cwd_name} 󰋣,${window_name_nvim}}"
set -g automatic-rename-format "${window_name_lazygit}"
# renumber windows when a window is closed
set -g renumber-windows on

# set terminal title
set -g set-titles on
# set -g set-titles-string "#S:#P:#W"
title_name_zsh="#{?#{==:#{pane_current_command},zsh},${cwd_name},#{pane_current_command}}"
title_name_nvim="#{?#{==:#{pane_current_command},nvim},${cwd_name} ✎,${title_name_zsh}}"
title_name_lazygit="#{?#{==:#{pane_current_command},lazygit},${cwd_name} 🛏,${title_name_nvim}}"
set -g set-titles-string "tmux - ${title_name_lazygit}"

# slightly longer pane indicators display time
set -g display-panes-time 800
# slightly longer status messages display time
set -g display-time 1000

# redraw status line every 10 seconds
set -g status-interval 10

# Show windows with the pane zoomed and windows collapsed
bind w choose-tree -Zw

# Change the move window bind with the swap window one
bind . command-prompt "swap-window -d -t %%"

# Display keys using fzf in a popup
bind ? display-popup -E -w 75% -h 75% ~/.config/tmux/scripts/fzf-keys.sh

# Open blank popup for use with something like Lazygit
bind b display-popup -E -w 75% -h 75% -d "#{pane_current_path}"
bind C-b display-popup -E -w 75% -h 75% -d "#{pane_current_path}"

# Start new session
bind + new

# Add Escape as an option to exit copy-mode-vi (regular copy-mode already has this).
bind -T copy-mode-vi Escape send-keys -X cancel

# Delete old files signaling that panes should be monitored.
run-shell "~/.config/tmux/scripts/reset_notify.sh"
# Shortcut to toggle pane monitoring (send notification when command exits).
bind k run-shell "~/.config/tmux/scripts/toggle_notify.sh"

# Join a pane in another window with the current one with the input 'window_number.pane_number' or
#  just 'window_number'.
bind j command-prompt "join-pane -s %%"

# Kill current session
bind C-x kill-session

# Replace default next/prev/last window selecting keybinds with ones that also refresh the status
#  bar so changing to a remote SSH client immediatly shows.
bind n select-window -n \; refresh-client -S
bind C-n select-window -n \; refresh-client -S
bind p select-window -p \; refresh-client -S
bind C-p select-window -p \; refresh-client -S
bind l select-window -l \; refresh-client -S
bind C-l select-window -l \; refresh-client -S

# Replace default window selecting keybinds by a script that creates the window if it doesn't exist.
bind 1 run-shell "~/.config/tmux/scripts/select-or-create.sh 1"
bind 2 run-shell "~/.config/tmux/scripts/select-or-create.sh 2"
bind 3 run-shell "~/.config/tmux/scripts/select-or-create.sh 3"
bind 4 run-shell "~/.config/tmux/scripts/select-or-create.sh 4"
bind 5 run-shell "~/.config/tmux/scripts/select-or-create.sh 5"
bind 6 run-shell "~/.config/tmux/scripts/select-or-create.sh 6"
bind 7 run-shell "~/.config/tmux/scripts/select-or-create.sh 7"
bind 8 run-shell "~/.config/tmux/scripts/select-or-create.sh 8"
bind 9 run-shell "~/.config/tmux/scripts/select-or-create.sh 9"
bind 0 run-shell "~/.config/tmux/scripts/select-or-create.sh 10"

# Carbonfox theme
background="#161616"
selection_background="#2a2a2a"
foreground_0="#f2f2f2"
foreground_1="#b8b8b8"
foreground_2="#7d7d7d"
blue="#78a9ff"
blue_faded="#2e3d56"
magenta="#be95ff"

# Inspired by: https://github.com/edeneast/nightfox.nvim/raw/main/extra/carbonfox/carbonfox.tmux
set -g mode-style "fg=${foreground_0},bg=${selection_background}"
set -g message-style "fg=${foreground_0},bg=${background}"
set -g message-command-style "fg=${foreground_0},bg=${background}"
set -g pane-border-style "fg=${foreground_1}"
set -g pane-active-border-style "fg=${blue}"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=${foreground_1},bg=${background}"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=${background},bg=${blue},bold] #S #[fg=${blue},bg=${background},nobold,nounderscore,noitalics]"
# https://github.com/tmux-plugins/tmux-prefix-highlight
prefix_pre_fg="#{?client_prefix,${blue_faded},#{?pane_in_mode,${blue_faded},#{?synchronize-panes,${blue_faded},${background}}}}"
prefix_text="#{?client_prefix, PREFIX ,#{?pane_in_mode, COPY ,#{?synchronize-panes, SYNC ,}}}"
prefix_pos_bg="#{?client_prefix,${blue_faded},#{?pane_in_mode,${blue_faded},#{?synchronize-panes,${blue_faded},${background}}}}"
ssh_bg="#{?#{pane_ssh_connected},${magenta},${blue}}"
set -g status-right "#[fg=${prefix_pre_fg},bg=${background},nobold,nounderscore,noitalics]#[fg=${foreground_0},bg=${blue_faded}]${prefix_text}#[fg=${ssh_bg},bg=${prefix_pos_bg},nobold,nounderscore,noitalics]#[fg=${background},bg=${ssh_bg},bold] #U@#H "
setw -g window-status-activity-style "underscore,fg=${foreground_2},bg=${background}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=${foreground_2},bg=${background}"
setw -g window-status-format "#[fg=${background},bg=${background},nobold,nounderscore,noitalics]#[default] #I #{?#W, #W ,}#{?window_marked_flag, ,}#{?window_zoomed_flag,󰨤 ,}#[fg=${background},bg=${background},nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=${background},bg=${blue_faded},nobold,nounderscore,noitalics]#[fg=${foreground_0},bg=${blue_faded}] #I #{?#W, #W ,}#{?window_marked_flag, ,}#{?window_zoomed_flag,󰨤 ,}#[fg=${blue_faded},bg=${background},nobold,nounderscore,noitalics]"

## Plugins, find more plugins on: https://github.com/rothgar/awesome-tmux
# The plugin manager
set -g @plugin 'tmux-plugins/tpm'
# Generally accepted good options
set -g @plugin 'tmux-plugins/tmux-sensible'
# Shows window with keymaps to help me remember
set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'jaclu/tmux-menus'
# Better pane navigation and integration with Neovim
set -g @plugin 'mrjones2014/smart-splits.nvim'
# Persists environments across system restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Continuous saving and automatic restoring of environments
set -g @plugin 'tmux-plugins/tmux-continuum'
# Enables displaying host and user of remote connections.
set -g @plugin "soyuka/tmux-current-pane-hostname"

## smart-splits options
set -g @smart-splits_no_wrap 'yes'
set -g @smart-splits_move_left_key  'M-h'
set -g @smart-splits_move_down_key  'M-j'
set -g @smart-splits_move_up_key    'M-k'
set -g @smart-splits_move_right_key 'M-l'
set -g @smart-splits_resize_left_key  'M-H'
set -g @smart-splits_resize_down_key  'M-J'
set -g @smart-splits_resize_right_key 'M-L'
set -g @smart-splits_resize_up_key    'M-K'
bind -n M-C-h if -F "#{@pane-is-vim}" 'send-keys M-C-h' 'swap-pane -d -t "{left-of}"'
bind -n M-C-j if -F "#{@pane-is-vim}" 'send-keys M-C-j' 'swap-pane -d -t "{down-of}"'
bind -n M-C-k if -F "#{@pane-is-vim}" 'send-keys M-C-k' 'swap-pane -d -t "{up-of}"'
bind -n M-C-l if -F "#{@pane-is-vim}" 'send-keys M-C-l' 'swap-pane -d -t "{right-of}"'
# bind -n 'M-;' if -F "#{@pane-is-vim}" 'send-keys "M-;"' 'last-pane'
bind -n 'M-;' last-pane
set -g @smart-splits_resize_step_size '1'
bind -n 'M-\' select-pane -l

## resurrect and continuum options
# set -g @resurrect-capture-pane-contents 'on' # This is kinda jank with Neovim
set -g @continuum-save-interval '1' # Every minute
set -g @continuum-restore 'on'

## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.config/tmux/plugins/tpm/tpm"
